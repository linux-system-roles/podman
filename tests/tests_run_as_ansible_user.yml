---
- name: Test podman_run_as_ansible_user
  hosts: all
  vars:
    __podman_override_username: podman_override_user
    podman_fail_if_too_old: false
  tasks:
    # ansible_user may be undefined (e.g. bootc); role falls back to whoami
    - name: Run test
      block:
        - name: Create user
          user:
            name: "{{ __podman_override_username }}"

        - name: Run role with podman_run_as_ansible_user
          include_tasks: tasks/run_role_with_clear_facts.yml
          vars:
            __sr_public: true
            podman_run_as_ansible_user: true
            podman_storage_conf:
              storage:
                runroot: /tmp
                graphroot: /var/lib/containers/storage

        - name: Check that config was written for ansible_user or whoami user
          command: grep /tmp {{ __podman_storage_conf_file | quote }}
          changed_when: false

        - name: Run role with explicit podman_run_as_user overriding ansible_user
          include_tasks: tasks/run_role_with_clear_facts.yml
          vars:
            podman_run_as_ansible_user: true
            podman_run_as_user: "{{ __podman_override_username }}"
            podman_storage_conf:
              storage:
                driver: overlay
                graphroot: /data/{{ __podman_override_username }}/storage
                runroot: /run/user/$UID/run

        - name: Check that explicit podman_run_as_user overrides ansible_user
          command: >-
            grep /data/{{ __podman_override_username }}/storage
            /home/{{ __podman_override_username }}/{{ __podman_storage_conf_user | quote }}
          changed_when: false

      always:
        - name: Cleanup storage configs
          tags:
            - tests::cleanup
          file:
            path: "{{ item }}"
            state: absent
          loop:
            - "{{ __podman_storage_conf_system }}"
            - "/home/{{ __podman_override_username }}/{{ __podman_storage_conf_user }}"

        - name: Remove user
          tags:
            - tests::cleanup
          user:
            name: "{{ __podman_override_username }}"
            state: absent
            remove: true
